<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIC-6 Terminal Module v1.1</title>

<style>
body{
    margin:0;
    background:#000;
    color:#00ff41;
    font-family:Consolas,monospace;
    overflow:hidden;
}

#title{
    background:#111;
    color:#e8920a;
    padding:8px;
    border-bottom:1px solid #e8920a;
}

#term{
    height:calc(100vh - 95px);
    overflow-y:auto;
    padding:10px;
    white-space:pre-wrap;
}

#typingBar{
    height:28px;
    border-top:1px solid #1a1a1a;
    border-bottom:1px solid #333;
    background:#050505;
    color:#00ff41;
    display:flex;
    align-items:center;
    padding:0 10px;
}

.typingLabel{
    color:#e8920a;
    margin-right:8px;
    font-weight:bold;
}

#inputrow{
    display:flex;
    padding:8px;
}

#prompt{
    color:#e8920a;
    margin-right:6px;
}

#cmd{
    flex:1;
    background:#000;
    color:#00ff41;
    border:none;
    outline:none;
    font-family:inherit;
    font-size:16px;
}
</style>
</head>

<body>

<div id="title">
AIC-6 TERMINAL (ARI-OS Replacement Module)
</div>

<div id="term"></div>

<div id="typingBar">
    <span class="typingLabel">Typing:</span>
    <span id="liveTyping"></span>
</div>

<div id="inputrow">
    <span id="prompt">C:\ARI&gt;</span>
    <input id="cmd" autofocus>
</div>

<script>

const out = document.getElementById("term");
const cmd = document.getElementById("cmd");
const liveTyping = document.getElementById("liveTyping");

const files = {
    "README.TXT":"AIC-6 Terminal for ARI-OS",
    "STATUS.TXT":"SYSTEM STATUS: OPERATIONAL"
};

function print(text=""){
    out.innerHTML += text + "\n";
    out.scrollTop = out.scrollHeight;
}

print("AIC-6 TERMINAL INITIALIZED");
print("Type HELP for commands.");
print("");

const commands = {

    HELP: () => {
        print("AVAILABLE COMMANDS");
        print("------------------");
        print("HELP");
        print("CLS");
        print("DIR");
        print("TYPE");
        print("STATUS");
        print("WHOAMI");
        print("VER");
        print("DASHBOARD");
        print("NOTES");
        print("TASKS");
        print("VAULT");
    },

    CLS: () => {
        out.innerHTML = "";
    },

    DIR: () => {
        Object.keys(files).forEach(file => print(file));
    },

    STATUS: () => {
        print("ALL SYSTEMS NOMINAL");
    },

    WHOAMI: () => {
        print("connor.moran");
    },

    VER: () => {
        print("AIC-6 Terminal v1.1");
    },

    DASHBOARD: () => {
        print("Launching ARI Dashboard...");
    },

    NOTES: () => {
        print("Opening ARI Notes...");
    },

    TASKS: () => {
        print("Opening ARI Tasks...");
    },

    VAULT: () => {
        print("Opening File Vault...");
    },

    TYPE: (arg) => {
        if(files[arg]){
            print(files[arg]);
        } else {
            print("File not found.");
        }
    }

};

cmd.addEventListener("input", () => {
    liveTyping.textContent = cmd.value;
});

cmd.addEventListener("keydown", (e) => {

    if(e.key === "Enter"){

        const value = cmd.value.trim();

        print("C:\\ARI> " + value);

        const parts = value.split(" ");
        const command = (parts.shift() || "").toUpperCase();
        const arg = parts.join(" ").toUpperCase();

        if(commands[command]){
            commands[command](arg);
        }
        else if(value !== ""){
            print("Unknown command");
        }

        print("");

        cmd.value = "";
        liveTyping.textContent = "";

    }

});

</script>

</body>
</html>
